version = 2

[global]
# Lossless Scaling's DLL (Steam > Lossless Scaling > Properties > Betas > "lsfg-vk")
dll = "/home/deck/.local/share/Steam/steamapps/common/Lossless Scaling/lsfg-vk.dll"
allow_fp16 = true

# No active_in on purpose: a profile is only used when the launch options pick it with LSFGVK_PROFILE.
[[profile]]
name = "Forza Handheld"
multiplier = 2
flow_scale = 0.75
performance_mode = true
pacing_mode = "vsync"

[[profile]]
name = "Forza TV"
multiplier = 2
flow_scale = 1.0
performance_mode = false
pacing_mode = "vsync"
