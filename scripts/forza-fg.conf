# Frame generation (lsfg-vk) per launcher, read by forza-fg.sh.
# <GAME>_<MODE>_FG: 1 = on, 0 = off.  <GAME>_<MODE>_BASE: real fps the game is capped to (lsfg-vk x2 doubles it).
FH2_HANDHELD_FG=1; FH2_HANDHELD_BASE=45
FH2_TV_FG=1;       FH2_TV_BASE=30
FH3_HANDHELD_FG=1; FH3_HANDHELD_BASE=30
FH3_TV_FG=1;       FH3_TV_BASE=30
# With frame generation on, turn HDR off in the game's launcher and use the SDR ReShade preset (reshade/*/Forza SDR.ini).

# Optional: full path to the DualSense helper (fh2-dualsense.py from the FH2-DualSense steam-deck fork).
# Empty = don't start it.
DUALSENSE_HELPER=""
